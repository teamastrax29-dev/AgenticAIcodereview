services:
  db:
    image: pgvector/pgvector:pg17
    container_name: code_reviewer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: code_reviewer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d code_reviewer"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: code_reviewer_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/code_reviewer
    volumes:
      - ./app:/code/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: